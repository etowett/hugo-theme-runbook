name: Archive parity

# specs/007 §2 Layer 2 — the archive smoke build, plus the specs/010 §2 URL manifest diff.
#
# ── WHY THIS IS NOT ON THE PULL-REQUEST PATH ─────────────────────────────────────────
#
# Not because it is slow. The whole job is about 90 seconds: two Hugo builds of ~1,159
# pages at ~4 s each, a manifest diff at ~11 s, and the gzip distribution.
#
# It is off the PR path because **the reference archive is a private repository and this
# one is public**. Reading it needs a token, and:
#
#   * `pull_request` from a fork gets no secrets, so the job would fail on every
#     external contribution — a red X nobody can act on, which is precisely what
#     docs/verification.md §2 says teaches people to ignore CI;
#   * a public repository's workflow that can read a private repository is a surface
#     worth keeping down to triggers only a maintainer can pull.
#
# `workflow_dispatch` and `schedule` both run from the base repository with base-repo
# secrets and are never triggered by a fork. That is the whole reason for this split.
#
# ── WHAT IS NEVER UPLOADED ───────────────────────────────────────────────────────────
#
# The built site. Artifacts on a public repository are downloadable by anyone, and the
# build is the full text of a private content repository. The manifests ARE uploaded:
# they contain only URLs, canonicals and sitemap entries of a site that is public on the
# web, and without them a failure is unactionable.
#
# ── CONTENT IS PINNED ────────────────────────────────────────────────────────────────
#
# specs/007 §2 requires the corpus pinned. It is pinned to a SHA below rather than to a
# branch, because a "no regression against the baseline" comparison across two different
# content commits measures the corpus changing, not the theme changing (specs/005 §3.1).
# Bump CITIZIX_REF deliberately, in its own commit, and regenerate the budget baseline in
# the same one.

on:
  workflow_dispatch:
    inputs:
      citizix_ref:
        description: "Reference-archive commit to build (default: the pinned SHA)"
        type: string
        required: false
      enforce_page_weight:
        description: "Enforce the page-weight distribution gates"
        type: boolean
        default: false
  schedule:
    # 04:00 UTC Sundays. Weekly, not daily: the archive changes on its own schedule and
    # nothing here can break without either this repository or that one moving.
    - cron: "0 4 * * 0"

permissions:
  contents: read
  issues: write

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CITIZIX_REPO: etowett/citizix
  # Pinned 2026-07-29, superseding dc1b321. That pin predated the three citizix commits
  # made FOR this migration — the `latmod:` typo fix, the retired-taxonomy redirects and
  # the 23 pinned taxonomy titles — so a first run against it would have reported
  # differences that were already fixed upstream.
  #
  # 497 post source files, 6 of them drafts, so 491 published posts. Every number below
  # was re-derived from a build at this SHA rather than carried over.
  CITIZIX_REF: 9ec479a6ee4de4e0f467d6d831cd3c43e67c67dd
  # Assertions on the RUNBOOK build at that content pin, as scripts/check_parity.py
  # --audit counts them: non-alias HTML pages and meta-refresh aliases. The Stack build
  # of the same content audits to 1,095 and 358; docs/migration.md §1 says why they
  # differ. Unchanged by `search.enable` — the index is JSON, not an HTML page.
  EXPECT_PAGES: 1064
  EXPECT_ALIASES: 356

jobs:
  parity:
    name: Reference archive — build, diff, weigh
    runs-on: ubuntu-latest
    steps:
      - name: Check out the theme
        uses: actions/checkout@v7
        with:
          path: hugo-theme-runbook

      - name: Is the archive reachable?
        id: gate
        # ── WHY THE TWO TRIGGERS ARE TREATED DIFFERENTLY ─────────────────────────────
        #
        # This step used to skip on both, and that is how the job stayed inert from the
        # day it was written: with no token every later step is skipped, the job exits 0,
        # and in the checks list a skipped job and a passing job are the same tick. The
        # gate that exists to keep this migration honest reported success for producing
        # no evidence at all (#44).
        #
        # `workflow_dispatch` is a person clicking Run. There is no reading of that click
        # under which "did nothing, reported success" is the answer they wanted, so it
        # FAILS and says what to set.
        #
        # `schedule` still skips, and for the reason the original comment gave: nobody is
        # watching a 04:00 Sunday cron, a fork cannot hold this secret, and a weekly red X
        # that no contributor can act on is what docs/verification.md §2 says teaches
        # people to ignore CI. It skips LOUDLY — a warning, not a notice, so the run
        # summary carries an annotation instead of a line nobody scrolls to.
        env:
          TOKEN: ${{ secrets.CITIZIX_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::CITIZIX_TOKEN is not set, so the reference archive cannot be"
            echo "::error::read and this run can prove nothing. Failing rather than"
            echo "::error::skipping: you asked for this run explicitly."
            echo "::error::Fix: set a fine-grained PAT with contents:read on"
            echo "::error::${CITIZIX_REPO} as the CITIZIX_TOKEN repository secret."
            exit 1
          fi
          echo "::warning::CITIZIX_TOKEN is not set — the reference archive is private,"
          echo "::warning::so the scheduled parity run proved nothing. This job is INERT,"
          echo "::warning::not passing. Set the secret, or dispatch it manually to get a"
          echo "::warning::hard failure instead of this warning."

      - name: Check out the reference archive (pinned)
        if: steps.gate.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CITIZIX_REPO }}
          ref: ${{ inputs.citizix_ref || env.CITIZIX_REF }}
          token: ${{ secrets.CITIZIX_TOKEN }}
          # hugo-theme-stack is a submodule and is the baseline half of the diff.
          submodules: true
          path: archive
          persist-credentials: false

      - name: Install Hugo
        if: steps.gate.outputs.available == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Stage two source trees
        if: steps.gate.outputs.available == 'true'
        # Never build in the checkout itself — see the "not yours to change" rule in
        # specs/010. Each migration step below is a documented step in
        # docs/migration.md; this job is the executable form of that guide, so a change
        # to one that is not made in the other will show up as a parity failure.
        run: |
          set -euo pipefail
          STACK="$RUNNER_TEMP/stack-site"
          RB="$RUNNER_TEMP/runbook-site"
          mkdir -p "$STACK" "$RB"

          # Baseline: the archive exactly as it ships, overrides and all.
          for d in content static assets archetypes layouts themes; do
            cp -R "archive/$d" "$STACK/"
          done
          cp archive/config.yaml "$STACK/"

          # Candidate: the same content with the migration applied.
          #  · no site layouts     — migration.md §5, all eleven overrides retire
          #  · no theme submodule  — Runbook comes from --themesDir
          #  · a rewritten config  — migration.md §2.3
          for d in content static assets archetypes; do
            cp -R "archive/$d" "$RB/"
          done
          cp hugo-theme-runbook/.github/parity/citizix-runbook.yaml "$RB/config.yaml"

          # The search page's `outputs: [html, rss, json]` is left ALONE. A step here
          # used to strip `json`, citing a docs/migration.md §3 paragraph that said
          # Runbook ships no JSON template for a page kind. It has shipped
          # layouts/search.json since #23, and root-level `search.json` is exactly what
          # Hugo's post-0.146 lookup matches for `layout: search` + kind page + output
          # json. Stripping it meant no parity run ever built Runbook's search index or
          # its UI — layouts/_partials/search/ui.html gates the whole widget on
          # `.OutputFormats.Get "json"` — so the one feature the gate could not see was
          # the newest one (#30).

          echo "STACK_SITE=$STACK" >> "$GITHUB_ENV"
          echo "RB_SITE=$RB" >> "$GITHUB_ENV"

      - name: Build the baseline (hugo-theme-stack)
        if: steps.gate.outputs.available == 'true'
        run: |
          hugo --source "$STACK_SITE" \
               --destination "$RUNNER_TEMP/public-stack" \
               --cleanDestinationDir --gc --minify

      - name: Build the candidate (Runbook)
        if: steps.gate.outputs.available == 'true'
        # --panicOnWarning is the point of this step. Hugo logs a missing layout, a
        # shortcode called with the wrong arguments and a deprecated function at WARN and
        # then exits 0, so without it a build that renders nothing useful is a green tick.
        run: |
          hugo --source "$RB_SITE" \
               --themesDir "$GITHUB_WORKSPACE" \
               --theme hugo-theme-runbook \
               --destination "$RUNNER_TEMP/public-runbook" \
               --cleanDestinationDir --gc --minify \
               --panicOnWarning --printPathWarnings

      - name: The search index was actually built
        if: steps.gate.outputs.available == 'true'
        # scripts/check_parity.py walks .html and .xml only, so /search/index.json is
        # invisible to the manifest diff on BOTH sides — it was never going to report the
        # index appearing or disappearing. That is why stripping `json` went unnoticed for
        # as long as it did, and it means the manifest diff cannot be the thing that keeps
        # search built. This step is. It asserts the file exists, parses, and carries
        # roughly the corpus, so a config or template regression that quietly empties the
        # index fails here instead of shipping a search box that finds nothing.
        run: |
          python3 - "$RUNNER_TEMP/public-runbook/search/index.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          try:
              d = json.load(open(p, encoding="utf-8"))
          except FileNotFoundError:
              sys.exit(f"::error::{p} was not built. Either params.runbook.search.enable "
                       "is off in .github/parity/citizix-runbook.yaml, or the archive's "
                       "search page stopped declaring `outputs: json`.")
          n = len(d.get("docs", []))
          # A floor, not an assertion of the exact count: the corpus grows between pins
          # and a number that has to be bumped every time is a number people stop reading.
          if n < 400:
              sys.exit(f"::error::search index has {n} documents, expected the post "
                       "corpus (491 at the pinned ref). Something is filtering it out.")
          print(f"search index: {n} documents, {len(open(p,'rb').read()):,} B")
          PY

      - name: REQ-CB-1 at archive scale
        if: steps.gate.outputs.available == 'true'
        # The per-PR gate (scripts/check_reqcb1.py) proves this on exampleSite in a few
        # seconds and is strictly stronger as a test of *structure*. This run proves it
        # against 8,907 real fenced blocks in 47 languages, which is the input the
        # fixture is a model of. Both are worth having; only this one meets the corpus.
        run: |
          HUGO_MARKUP_HIGHLIGHT_LINENOS=true \
          HUGO_MARKUP_HIGHLIGHT_LINENUMBERSINTABLE=true \
          hugo --source "$RB_SITE" \
               --themesDir "$GITHUB_WORKSPACE" \
               --theme hugo-theme-runbook \
               --destination "$RUNNER_TEMP/public-hostile" \
               --cleanDestinationDir --gc --minify \
               --panicOnWarning
          if ! diff -rq "$RUNNER_TEMP/public-runbook" "$RUNNER_TEMP/public-hostile"; then
            echo "::error::REQ-CB-1 — the archive build is NOT identical under the"
            echo "::error::consumer's own lineNos/lineNumbersInTable configuration."
            exit 1
          fi
          echo "Byte-identical under hostile line-number configuration."

      - name: Build-wide invariants
        if: steps.gate.outputs.available == 'true'
        working-directory: hugo-theme-runbook
        run: |
          python3 scripts/check_parity.py --audit "$RUNNER_TEMP/public-runbook" \
                  --expect-pages "$EXPECT_PAGES" --expect-aliases "$EXPECT_ALIASES"

      - name: URL / canonical / RSS / sitemap / OG / JSON-LD manifest diff
        if: steps.gate.outputs.available == 'true'
        working-directory: hugo-theme-runbook
        # Fails on any difference that is not in .github/parity/reviewed-differences.json
        # WITH A REASON. A theme swap producing zero differences would mean the new theme
        # was the old theme; the deliverable is that every difference is deliberate and
        # written down.
        #
        # Emitted as two manifests and then diffed, rather than diffed in one pass, so
        # that a failure leaves both artefacts behind. Without them the report says what
        # moved but not what the other side looked like.
        run: |
          python3 scripts/check_parity.py --emit "$RUNNER_TEMP/public-stack" \
                  --out "$RUNNER_TEMP/manifest-stack.json"
          python3 scripts/check_parity.py --emit "$RUNNER_TEMP/public-runbook" \
                  --out "$RUNNER_TEMP/manifest-runbook.json"
          python3 scripts/check_parity.py \
                  --manifests "$RUNNER_TEMP/manifest-stack.json" \
                              "$RUNNER_TEMP/manifest-runbook.json" \
                  --json "$RUNNER_TEMP/parity-diff.json"

      - name: JSON-LD parses, and Article values are asserted
        if: steps.gate.outputs.available == 'true'
        working-directory: hugo-theme-runbook
        # --require-article because this corpus is 489 article pages: without it the
        # value assertions are inert and the check degrades to "the JSON parses", which
        # is exactly what let the reference site ship double-encoded structured data on
        # 493 of 493 pages for months (specs/004 §2a).
        run: python3 scripts/check_jsonld.py "$RUNNER_TEMP/public-runbook" --require-article

      - name: Internal link and fragment crawl
        if: steps.gate.outputs.available == 'true'
        working-directory: hugo-theme-runbook
        # BLOCKING. It was advisory until the first execution of this job (#44) proved
        # there was nothing left for it to tolerate.
        #
        # The single failure it existed to absorb was `#security-hardening`, linked from
        # the SaltStack GitOps post and defined by no heading on it. That failed
        # identically on the Stack build, so it was the archive's bug rather than the
        # theme's and docs/migration.md §9 defect 6 classified it there. citizix fixed it
        # in 49fdb91, which is inside this pin: at 9ec479a that page carries neither the
        # dangling href nor the id, and run 30436578455 reports `no broken internal
        # links, subresources or fragments` across the whole build.
        #
        # Keeping `continue-on-error` past that point would make this step exactly what
        # #29 and #44 are each about — a suppression that outlives its defect, and then
        # absorbs the next one silently while still reporting a green tick. The reason it
        # was advisory is in the git history if the archive ever regresses.
        #
        # Internal links only. The external sweep is weekly and lives in scheduled.yml
        # (specs/007 §3.5): it takes minutes over thousands of links and fails when a
        # third party's documentation site is down.
        run: python3 scripts/check_links.py "$RUNNER_TEMP/public-runbook"

      - name: Page weight — distribution and per-page no-regression
        if: steps.gate.outputs.available == 'true'
        working-directory: hugo-theme-runbook
        # The baseline is captured from the SAME content commit as the comparison, in the
        # same job, on the same runner. All three matter: a different commit measures the
        # corpus changing, and a different platform measures gzip changing — GNU gzip and
        # Apple gzip disagree on the same bytes (docs/verification.md §1).
        #
        # --article-glob is explicit because the archive uses flat /:slug/ permalinks and
        # the default `posts/*/index.html` matches nothing there.
        #
        # ⚠️ ADVISORY, and only because that same flat-permalink glob is too broad. Both
        # failures it reports at the pinned ref are pages that are not articles, measured
        # against budgets specs/005 §3.1 scopes to articles:
        #
        #   tags/index.html grew 4,544 → 5,496 B gz (+21.0%) — the unpaginated taxonomy
        #     browse page, which is docs/migration.md §4's documented, intended cost and
        #     is already a reviewed `url` difference. The per-page no-regression rule is
        #     not gated on --enforce-page-weight, so this fails the step outright.
        #   search/index.html: 3 executable script tags (budget 2) — the inline theme
        #     guard, runbook.js, and the lazily-loaded search chunk. check_budgets.py
        #     budgets that chunk separately at SEARCH_JS_GZ_MAX and then counts it again
        #     here, so the gate contradicts itself on the one page that loads it.
        #
        # Both are `--article-glob '*/index.html'` sweeping non-articles into an
        # article-scoped budget — the same root cause as docs/migration.md §9 defect 4.
        # The fix belongs in scripts/check_budgets.py, which stream D owns (contracts §1),
        # so it is named here rather than made here. Remove `continue-on-error` once that
        # script can tell an article from a browse page.
        continue-on-error: true
        run: |
          python3 scripts/check_budgets.py "$RUNNER_TEMP/public-stack" \
                  --article-glob '*/index.html' \
                  --write-baseline "$RUNNER_TEMP/stack-baseline.json"
          python3 scripts/check_budgets.py "$RUNNER_TEMP/public-runbook" \
                  --article-glob '*/index.html' \
                  --baseline "$RUNNER_TEMP/stack-baseline.json" \
                  --json "$RUNNER_TEMP/budgets.json" \
                  ${{ inputs.enforce_page_weight && '--enforce-page-weight' || '' }}

      - name: Upload the manifests
        if: always() && steps.gate.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parity-manifests
          # URLs, canonicals, sitemap entries and byte counts only. The BUILT SITE is
          # deliberately absent: artifacts on a public repository are downloadable by
          # anyone and the build is the full text of a private content repository.
          path: |
            ${{ runner.temp }}/manifest-stack.json
            ${{ runner.temp }}/manifest-runbook.json
            ${{ runner.temp }}/parity-diff.json
            ${{ runner.temp }}/stack-baseline.json
            ${{ runner.temp }}/budgets.json
          retention-days: 14

      - name: Open or update a tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Archive parity against the reference site is failing"
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          The weekly archive parity build failed.

          Read the failing step first — the three failure modes need completely different
          responses:

          * **The manifest diff.** A URL, canonical, alias, RSS item, sitemap entry, `og:url`
            or JSON-LD `mainEntityOfPage` moved. Either put it back, or add a rule to
            `.github/parity/reviewed-differences.json` **with a reason** — the reason is
            structurally mandatory and `scripts/check_parity.py` fails on an empty one, so
            that the next person tidying the file cannot delete a real decision.
          * **REQ-CB-1.** The archive build stopped being byte-identical under the reference
            site's own `lineNos` / `lineNumbersInTable` settings. Something in
            `layouts/_markup/render-codeblock.html` stopped forcing a structure-changing key,
            and the consumer's configuration is back in the theme's output.
            docs/contracts.md §3 has the mechanism: an UNSET key is where it gets in.
          * **Page weight.** Check whether it is the distribution gate or the per-page
            no-regression rule. The second one is the meaningful test — a theme cannot
            compress content, but it must never make a given page heavier than the theme it
            replaced rendered it.

          If the archive content moved rather than the theme, bump `CITIZIX_REF` in this
          workflow in its own commit and say so — the baseline and the comparison have to be
          the same content commit or the numbers measure the corpus, not the theme.
          BODY
          printf '\nRun: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/body.md"
          EXISTING=$(gh issue list --state open --label ci-parity \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/body.md"
          else
            gh label create ci-parity --description "Opened by the archive parity job" \
              --color 0E8A16 2>/dev/null || true
            gh issue create --title "$TITLE" --label ci-parity \
              --body-file "$RUNNER_TEMP/body.md"
          fi
