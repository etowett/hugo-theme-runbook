# exampleSite — the Hugo Themes showcase demo AND the synthetic fixture host
# (specs/009 §3, specs/007 §2 Layer 1).
#
# Build it from the repo root with:
#     hugo server --source exampleSite --themesDir ../.. --disableFastRender
#
# That command requires the checkout directory to be named `hugo-theme-runbook`, which
# is true of a normal clone and NOT true of a git worktree. From a worktree, point
# --themesDir at a directory containing a symlink of that name.
#
# ▸ specs/009 §2: NO third-party tracking with live credentials may appear anywhere in
#   this directory. The showcase rejects it, and it is also why the demo is this site
#   and not citizix.com, which carries AdSense, GTM and GA4.

baseURL = "https://example.com/"
title = "Runbook"
defaultContentLanguage = "en"
theme = "hugo-theme-runbook"

# The home page paginates, which is what regenerates the `/page/{n}/` URL space the
# reference site depends on (specs/010 §2).
[pagination]
  pagerSize = 10

# specs/003 §3.4 — main sections are configurable, never a hard-coded "post".
[params]
  mainSections = ["posts"]
  description = "A minimal, code-first Hugo theme for technical blogs."

  [params.runbook]
    themeMode = "auto"
    showThemeToggle = true

    [params.runbook.author]
      name = "Runbook"

    [params.runbook.seo]
      jsonLd = true
      # Never <meta name="keywords"> — specs/003 §3.7 item 3.

    # M4b — client-side search over a metadata-only index (specs/005 §4, ADR-5).
    #
    # `enable` is FALSE in the theme's own defaults, deliberately: a theme that ships
    # a search page nobody asked for has added a URL to every consumer's site. The
    # demo turns it on because content/search.md is the fixture that reaches
    # layouts/search.html and layouts/search.json, and CI builds with
    # --printUnusedTemplates against a reasoned allowlist — a template with no
    # fixture fails the build.
    #
    # Turning it on takes two things, not one: this flag AND
    # `outputs = ["html", "json"]` on the search page itself, which is what emits
    # /search/index.json. See exampleSite/content/search.md and docs/search.md.
    [params.runbook.search]
      enable = true
      # Characters of summary per document. THIS IS THE BUDGET LEVER: the reference
      # archive's index measures 184 KB raw / 40 KB gz at 160, and 321 KB / 77 KB
      # uncapped, against a 250 KB / 60 KB budget. 0 drops summaries entirely, which
      # is what an archive past ~700 posts has to do. docs/search.md has the table.
      summaryLength = 160
      # Which taxonomies contribute terms. A theme cannot register a taxonomy, so a
      # site whose terms live under `topics` has to be able to say so.
      taxonomies = ["tags", "categories"]
      maxResults = 30

    # REQ-TAX-1 — the whole point of the feature: `amazon-eks` renders as "Amazon
    # EKS" and `ci-cd` as "CI/CD" WITHOUT a single taxonomy `_index.md` file. The
    # reference site carries 60 such files that do nothing else. Keys are the term's
    # URL segment; only terms whose capitalisation cannot be inferred need an entry.
    [params.runbook.taxonomyTitles]
      "amazon-eks" = "Amazon EKS"
      "ci-cd" = "CI/CD"
      "github-actions" = "GitHub Actions"
      "sql-server" = "SQL Server"
      "cert-manager" = "cert-manager"

    # Open decision #4 — 159 single-use tags on the reference site. 0 disables the
    # collapsed "Rarely used" group, which is right for a demo whose every term is
    # used once. A real archive sets 1.
    [params.runbook.taxonomy]
      rareThreshold = 0

[markup]
  [markup.highlight]
    noClasses = false        # ADR-2 — required by any consuming site
    lineNos = false
    lineNumbersInTable = false
    guessSyntax = false
  [markup.goldmark.renderer]
    unsafe = false

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 20
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 30

[taxonomies]
  tag = "tags"
  category = "categories"
  # Series is a taxonomy the CONSUMER must register — a theme cannot register one.
  # specs/003 §3.4: this ships with documentation or it does not work.
  series = "series"

# Related-posts weighting mirrors the reference site so relevance can be judged against
# a real corpus rather than a synthetic one (specs/003 §3.4).
[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 200

# Full-content RSS (specs/003 §3.7). Uncapped here because the demo has a handful of
# posts; a large archive caps it:
#   [services.rss]
#     limit = 20
