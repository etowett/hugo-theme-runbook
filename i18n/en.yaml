# specs/003 §3.8 — EVERY UI chrome string lives here from day one. A string hard-coded
# into a template cannot be translated, and retrofitting i18n means touching every
# layout. This is a showcase-adoption requirement.
#
# Workstreams add keys to their own area of this file. Keep the section grouping.

